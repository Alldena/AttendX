<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AttendX | Student Attendance</title>
  <link rel="stylesheet" href="style.css">
  <!-- QR code scanning library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
  <header>
    <h1>AttendX</h1>
    <p>Student Attendance Portal</p>
  </header>
  <main class="container">
    <section class="card">
      <h2>Mark Your Attendance</h2>
      <p>Enter your details, then scan your teacher's QR code.</p>
      <label for="studentName">Student Name</label>
      <input id="studentName" type="text" placeholder="Enter your name">
      <label for="studentId">Student ID</label>
      <input id="studentId" type="text" placeholder="Enter your student ID">
      <h3>Scan QR Code</h3>
      <div id="reader" style="width:100%; max-width:400px;"></div>
      <p id="scanStatus">Tap Start Scanner to use your camera.</p>
      <button type="button" id="startScan">Start Scanner</button>
      <button type="button" id="stopScan">Stop Scanner</button>
      <label for="qrData">Scanned QR Contents</label>
      <textarea id="qrData" rows="4"
        placeholder="Your scanned QR information will appear here"></textarea>
      <button type="button" id="verifyButton">Verify QR</button>
      <p id="result"></p>
      <a href="index.html">Back to Home</a>
    </section>
  </main>
  <script>
    const studentName = document.getElementById("studentName");
    const studentId = document.getElementById("studentId");
    const qrData = document.getElementById("qrData");
    const scanStatus = document.getElementById("scanStatus");
    const result = document.getElementById("result");
    let scanner = null;
    let scannerRunning = false;
    function getActiveSession() {
      try {
        return JSON.parse(localStorage.getItem("attendx_active_session"));
      } catch {
        return null;
      }
    }
    function onScanSuccess(decodedText) {
      qrData.value = decodedText;
      scanStatus.textContent = "QR scanned successfully!";
      result.textContent = "QR captured. Now tap Verify QR.";
      stopScanner();
    }
    async function startScanner() {
      if (scannerRunning) return;
      if (!window.isSecureContext) {
        scanStatus.textContent =
          "Camera access requires HTTPS or localhost. Open the site using Live Server or its HTTPS link.";
        return;
      }
      try {
        if (!scanner) {
          scanner = new Html5Qrcode("reader");
        }
        scanStatus.textContent = "Requesting camera permission...";
        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          onScanSuccess,
          () => {}
        );
        scannerRunning = true;
        scanStatus.textContent = "Point your camera at the teacher's QR code.";
      } catch (error) {
        scanStatus.textContent =
          "Could not start camera. Allow camera permission and try HTTPS or localhost.";
        console.error(error);
      }
    }
    async function stopScanner() {
      if (scanner && scannerRunning) {
        try {
          await scanner.stop();
        } catch (error) {
          console.error(error);
        }
        scannerRunning = false;
      }
    }
    document.getElementById("startScan").addEventListener("click", startScanner);
    document.getElementById("stopScan").addEventListener("click", stopScanner);
    document.getElementById("verifyButton").addEventListener("click", () => {
      result.textContent = "";
      const name = studentName.value.trim();
      const id = studentId.value.trim();
      const rawQR = qrData.value.trim();
      if (!name || !id || !rawQR) {
        result.textContent = "Please enter your name and ID, then scan the QR code.";
        return;
      }
      let qr;
      try {
        qr = JSON.parse(rawQR);
      } catch {
        result.textContent = "Invalid QR code. Please scan the teacher's AttendX QR.";
        return;
      }
      const activeSession = getActiveSession();
      if (!activeSession || activeSession.status !== "active") {
        result.textContent = "No active class found. Ask your teacher to start the class.";
        return;
      }
      if (
        qr.project !== "AttendX" ||
        qr.sessionId !== activeSession.sessionId ||
        qr.className !== activeSession.className
      ) {
        result.textContent = "This QR code does not match the active class.";
        return;
      }
      if (!qr.expiresAt || Date.now() > Number(qr.expiresAt)) {
        result.textContent = "This QR code has expired. Scan the latest QR code.";
        return;
      }
      const attendance = JSON.parse(
        localStorage.getItem("attendx_attendance") || "[]"
      );
      const duplicate = attendance.some(
        record =>
          record.studentId.toLowerCase() === id.toLowerCase() &&
          record.sessionId === activeSession.sessionId
      );
      if (duplicate) {
        result.textContent = "Attendance has already been recorded for this student.";
        return;
      }
      attendance.push({
        studentName: name,
        studentId: id,
        className: activeSession.className,
        sessionId: activeSession.sessionId,
        status: "Present",
        timestamp: new Date().toISOString()
      });
      localStorage.setItem("attendx_attendance", JSON.stringify(attendance));
      result.textContent = "Attendance marked successfully!";
    });
  </script>
</body>
</html>
